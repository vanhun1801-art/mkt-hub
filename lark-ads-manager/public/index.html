<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý quảng cáo đa nền tảng · Rooty Trip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232b5cff'/><text x='16' y='22' font-size='14' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>QC</text></svg>">
<link rel="stylesheet" href="styles.css?v=__V__">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">QC</span>
    <div>
      <div class="brand-title">Quản lý quảng cáo đa nền tảng</div>
      <div class="brand-sub" id="brandSub">đang nạp dữ liệu…</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn src" id="srcChip" title="Đổi nguồn số: trực tiếp từ nền tảng, hay từ Lark Base">—</button>
    <button class="btn ghost" id="btnTargets" title="Đặt CPA mục tiêu và ngưỡng cảnh báo">Mục tiêu</button>
    <button class="btn ghost" id="btnRefresh" title="Nạp lại dữ liệu từ Lark Base">Làm mới</button>
    <a class="btn ghost" id="linkBase" target="_blank" rel="noreferrer" title="Mở Lark Base">Mở Base</a>
    <span class="chip" id="meChip">—</span>
  </div>
</header>

<div class="tabsbar"><nav class="tabs" id="tabs"></nav></div>

<section class="filters" id="filters">
  <div class="fgroup">
    <label>Khoảng thời gian</label>
    <div class="seg" id="rangeSeg"></div>
  </div>
  <div class="fgroup">
    <label>Từ ngày</label>
    <input type="date" id="fFrom">
  </div>
  <div class="fgroup">
    <label>Đến ngày</label>
    <input type="date" id="fTo">
  </div>
  <div class="fgroup">
    <label>Nền tảng</label>
    <div class="pills" id="fPlatform"></div>
  </div>
  <div class="fgroup grow">
    <label>Chiến dịch</label>
    <select id="fCampaign" multiple size="1"></select>
  </div>
  <div class="fgroup">
    <label>&nbsp;</label>
    <button class="btn ghost small" id="btnClearFilter">Bỏ lọc</button>
  </div>
</section>

<main id="view"><div class="loading">Đang nạp dữ liệu từ Lark Base…</div></main>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<!-- ?v= do server thay bang van tay noi dung moi lan khoi dong. Header no-store mot
     minh khong du: app chay sau proxy cua mkt-hub, va proxy co the tra ban cu. Thieu
     cai nay thi deploy xong giao dien van la ban cu ma khong ai biet. -->
<script src="charts.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
<script src="ketnoi.js?v=__V__"></script>
</body>
</html>
