<title>Quản lý quảng cáo đa nền tảng · Rooty Trip</title>

<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">QC</span>
    <div>
      <div class="brand-title">Quản lý quảng cáo đa nền tảng</div>
      <div class="brand-sub" id="brandSub">đang nạp dữ liệu…</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn src" id="srcChip" title="Đổi nguồn số: trực tiếp từ nền tảng, hay từ Lark Base">—</button>
    <button class="btn ghost" id="btnTargets" title="Đặt CPA mục tiêu và ngưỡng cảnh báo">Mục tiêu</button>
    <button class="btn ghost" id="btnRefresh" title="Đọc lại số mới nhất từ Base">Làm mới</button>
    <a class="btn ghost" id="linkBase" target="_blank" rel="noreferrer" title="Mở bảng dữ liệu gốc trên Lark">Mở Base</a>
    <span class="chip" id="meChip">—</span>
  </div>
</header>

<div class="tabsbar"><nav class="tabs" id="tabs"></nav></div>

<section class="filters" id="filters">
  <div class="fgroup">
    <label>Khoảng thời gian</label>
    <div class="seg" id="rangeSeg"></div>
  </div>
  <div class="fgroup">
    <label>Từ ngày</label>
    <input type="date" id="fFrom">
  </div>
  <div class="fgroup">
    <label>Đến ngày</label>
    <input type="date" id="fTo">
  </div>
  <div class="fgroup">
    <label>Nền tảng</label>
    <div class="pills" id="fPlatform"></div>
  </div>
  <div class="fgroup grow">
    <label>Chiến dịch</label>
    <select id="fCampaign" multiple size="1"></select>
  </div>
  <div class="fgroup">
    <label>&nbsp;</label>
    <button class="btn ghost small" id="btnClearFilter">Bỏ lọc</button>
  </div>
</section>

<!-- Kênh đang bật mà gọi lỗi thì băng này hiện lên. Nằm NGOÀI #view để không bị
