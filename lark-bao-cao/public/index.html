<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo công việc</title>
<link rel="stylesheet" href="/styles.css?v=BUILD">
<link rel="stylesheet" href="/khung-xuong.css?v=BUILD">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="dau">BC</div>
    <div>
      <b>Báo cáo công việc</b>
      <small id="phuDe">đang tải…</small>
    </div>
  </div>

  <!-- Hai bộ tab tách hẳn nhau: nhân sự làm việc của mình, quản lý nhìn cả
       phòng. Gộp một hàng thì nhân sự phải lướt qua mấy mục không bấm được. -->
  <div class="pills" id="tabToi"></div>
  <div class="pills" id="tabQL" hidden></div>

  <div class="lon"></div>
  <span class="chip" id="chipToi"><span class="cham"></span><span>…</span></span>
  <button class="btn nho" id="btnXuat">Xuất CSV</button>
  <button class="btn nho" id="btnLark" hidden>Mở Base</button>
</header>

<!-- Hai cột trong CÙNG một trang, không phải lớp phủ.
     Anh Hùng: "dạng là một trang cùng với giao diện từ bên phải trượt sang bên
     trái, cái thành phần khác sẽ tự động co giãn để phù hợp". Nên Sổ là cột
     thật: nó mở ra thì cột nội dung hẹp lại, chứ không bị che. -->
<div class="than-trang">
  <main id="man">
  <!-- Khung xương thay cho dòng chữ "đang tải": vẽ sẵn hình dạng của màn
     sắp hiện ra (xem public/khung-xuong.css — bản gốc ở lark-mkt-hub,
     đồng bộ bằng `node dong-bo-khung.js`). -->
  <div class="kx-man kx-vung" aria-busy="true" aria-label="Đang nạp báo cáo"><div class="kx-man-the"><div class="kx-the"><span class="kx kx-chu nho" style="width:74%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:56%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:88%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:62%"></span><span class="kx kx-so to"></span></div></div><div class="kx-man-bang"><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:74%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:88%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:56%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:62%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:88%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:80%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:62%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:50%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:80%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:70%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:50%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:64%"></span></span><span class="kx kx-nut" style="width:60px"></span></div></div></div>
  </main>

  <aside id="so" aria-label="Chi tiết kỳ">
    <header class="so-dau">
      <b id="soTieuDe">Chi tiết kỳ</b>
      <span class="nho" id="soPhu"></span>
      <div class="lon"></div>
      <button class="btn nho mo" id="soDong" title="Đóng (Esc)">✕</button>
    </header>
    <div class="so-than" id="soThan"></div>
  </aside>
</div>

<script src="/khung-xuong.js?v=BUILD"></script>
<script src="/app.js?v=BUILD"></script>
</body>
</html>
