<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hộp thư · Rooty Trip</title>
<link rel="stylesheet" href="styles.css?v=BUILD">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">✉</div>
    <div class="ten">Hộp thư</div>
  </div>
  <div class="tim">
    <input id="oTim" type="search" placeholder="Tìm người gửi, tiêu đề" autocomplete="off" aria-label="Tìm thư">
  </div>
  <span class="sp"></span>
  <span id="moc" class="moc"></span>
  <button id="btnLamMoi" class="nut-tron" title="Đọc lại từ Lark Mail" aria-label="Đọc lại từ Lark Mail">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
  </button>
</header>

<!-- Khuôn cố định hai phần (anh Hùng 28/10/2026: "giao diện nhảy tùm lum"):
     trái là danh sách, phải là nội dung thư. Vách giữa kéo được để đổi tỷ lệ;
     mỗi phần đóng lại được bằng nút trên đầu khung đọc. Điện thoại thì phần
     phải trượt vào khi mở thư. -->
<div class="than-trang">
  <section class="cot-trai" id="cotTrai" aria-label="Danh sách thư">
    <div class="dau-trai">
      <nav class="dai-ngan" id="dsNgan" role="tablist" aria-label="Ngăn thư"></nav>
      <div class="dai-hop" id="dsHop" aria-label="Lọc theo hộp thư"></div>
    </div>
    <main id="cotDs">
      <div id="ds" class="ds"></div>
    </main>
  </section>

  <div class="vach" id="vach" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Kéo để đổi độ rộng danh sách, bấm đúp để về mặc định"><i></i></div>

  <aside id="cotDoc" aria-label="Nội dung thư" hidden>
    <div class="doc-dau">
      <button id="btnVe" class="nut-tron ve" aria-label="Về danh sách">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="btnThuDs" class="nut-tron thu-ds" title="Ẩn danh sách" aria-label="Ẩn danh sách" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
      </button>
      <div class="hang-nut" id="hangNut"></div>
      <button id="btnDongDoc" class="nut-tron dong-doc" title="Đóng khung đọc" aria-label="Đóng khung đọc">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="doc-than" id="docThan"></div>
  </aside>
</div>

<!-- Xem trước khi gửi: đúng bản người nhận sẽ đọc, soát chữ, rồi mới gửi. -->
<div class="nen-hop" id="hopGui" hidden>
  <div class="hop-xn rong" role="dialog" aria-modal="true" aria-labelledby="hopGuiTieu">
    <div class="hop-dau"><b id="hopGuiTieu">Xem trước khi gửi</b></div>
    <div class="hop-than" id="hopGuiThan"></div>
    <div class="hop-chan">
      <span class="ly-do" id="hopGuiLyDo"></span>
      <button class="nut phu" id="hopGuiHuy">Sửa tiếp</button>
      <button class="nut chinh" id="hopGuiOk">Gửi ngay</button>
    </div>
  </div>
</div>

<!-- Hộp nhỏ dùng chung: thêm vào lịch, đặt tên nhóm, sửa chữ ký. -->
<div class="nen-hop" id="hopNho" hidden>
  <div class="hop-xn" role="dialog" aria-modal="true" aria-labelledby="hopNhoTieu">
    <div class="hop-dau"><b id="hopNhoTieu"></b></div>
    <div class="hop-than" id="hopNhoThan"></div>
    <div class="hop-chan">
      <span class="ly-do" id="hopNhoLyDo"></span>
      <button class="nut phu" id="hopNhoHuy">Đóng</button>
      <button class="nut chinh" id="hopNhoOk">Lưu</button>
    </div>
  </div>
</div>

<div class="menu-noi" id="menuNoi" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="app.js?v=BUILD"></script>
</body>
</html>
