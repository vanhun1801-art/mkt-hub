<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kho media</title>
<!-- Bản gốc: lark-mkt-hub/public/ — sửa ở đó rồi chạy dong-bo-khung.js -->
<link rel="stylesheet" href="mobile-chung.css?v=BUILD">
<link rel="stylesheet" href="khung-xuong.css?v=BUILD">
<style>
:root{
  --nen:#f4f6fa;--the:#fff;--vien:#e3e8f0;--chu:#1a2233;--phu:#5b6576;--nhat:#8b95a7;
  --brand:#2b5cff;--brand-nhat:#e8eeff;--brand-chu:#1f47d1;--hover:#f0f3f9;
  --bong:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.05);
  --o:#e6ebf3;--o-chu:#8793a8;--vang:#b7791f;
}
:root[data-theme="toi"]{
  --nen:#0f131b;--the:#171c26;--vien:#262d3b;--chu:#e6e9ef;--phu:#a3acbb;--nhat:#7a8496;
  --brand:#6f8fff;--brand-nhat:#1d2847;--brand-chu:#a9bcff;--hover:#1e2431;
  --bong:0 1px 2px rgba(0,0,0,.3);--o:#1f2633;--o-chu:#6f7b90;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="sang"]){
  --nen:#0f131b;--the:#171c26;--vien:#262d3b;--chu:#e6e9ef;--phu:#a3acbb;--nhat:#7a8496;
  --brand:#6f8fff;--brand-nhat:#1d2847;--brand-chu:#a9bcff;--hover:#1e2431;
  --bong:0 1px 2px rgba(0,0,0,.3);--o:#1f2633;--o-chu:#6f7b90;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.khung{max-width:1360px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px;box-shadow:var(--bong);padding:16px 18px;min-width:0}
.nhan{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--nhat);text-transform:uppercase;margin:0}
.dau{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.so{font-size:12px;color:var(--nhat);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button,a.nut-a{font:inherit;color:inherit;background:var(--the);border:1px solid var(--vien);border-radius:8px;height:34px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px}
button:hover,a.nut-a:hover{background:var(--hover)}
.chinh{background:var(--brand)!important;border-color:var(--brand)!important;color:#fff!important}
.tong{display:flex;gap:22px;flex-wrap:wrap}
.tong div{display:flex;flex-direction:column}
.tong b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.tong span{font-size:11px;color:var(--nhat);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.tim{display:flex;gap:8px;margin-top:14px}
.o-tim{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--vien);border-radius:10px;padding:0 12px;height:42px;background:var(--the);min-width:0}
.o-tim:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-nhat)}
.o-tim input{flex:1;border:0;outline:0;background:transparent;color:var(--chu);font:inherit;font-size:15px;min-width:0;height:100%}
.o-tim input::-webkit-search-cancel-button{display:none}
.o-tim input::placeholder{color:var(--nhat)}
.o-tim-boc{position:relative;flex:1;min-width:0}
/* Nút xoá: vùng bấm có thể to (điện thoại ép sàn chạm 40px), nhưng chỉ VẼ vòng tròn nhỏ quanh dấu × */
.o-tim-xoa{border:0;background:transparent;min-width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--phu);flex:none}
.o-tim-xoa[hidden]{display:none!important}
.nhan-moi{color:var(--do,#e5484d);font-weight:700}
.pill.on .nhan-moi,.chip.on .nhan-moi{color:inherit}
#spChon .so{white-space:nowrap;align-self:center}
.o-tim-xoa .ic{width:22px;height:22px;padding:5px;border-radius:50%;background:var(--hover);stroke-width:2.2}
/* Bảng gợi ý: ĐỤC hẳn (bảng chọn trong suốt thì chữ phía sau lộ qua) */
.goi-y{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:var(--the);border:1px solid var(--vien);border-radius:12px;
  box-shadow:0 14px 36px rgba(20,30,60,.16),0 2px 6px rgba(20,30,60,.08);padding:6px;max-height:min(440px,62vh);overflow:auto;overscroll-behavior:contain}
.gy-nhom{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--nhat);text-transform:uppercase;padding:8px 10px 4px}
.gy-dong{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:38px;border-radius:8px;cursor:pointer;color:var(--chu)}
.gy-dong.chon{background:var(--hover)}
@media (hover:hover) and (pointer:fine){.gy-dong:hover{background:var(--hover)}}
.gy-dong .ic{width:16px;height:16px;color:var(--nhat)}
.gy-ten{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.gy-ten b{font-weight:700;color:var(--brand-chu)}
.gy-loai{font-size:12px;color:var(--nhat);white-space:nowrap}
.gy-n{font-size:12px;color:var(--nhat);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.gy-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 8px}
.gy-trong{padding:14px 10px;color:var(--nhat);font-size:13px}
.loc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border:1px solid var(--vien);border-radius:999px;font-size:12.5px;color:var(--phu);cursor:pointer;user-select:none;background:var(--the);white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--brand-nhat);border-color:transparent;color:var(--brand-chu);font-weight:600}
.ngan{width:1px;height:18px;background:var(--vien);margin:0 4px}
.o{position:relative;border-radius:10px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--o-chu);overflow:hidden;cursor:pointer;background:var(--o);outline:2px solid transparent;outline-offset:2px}
.o img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.o img.xong{opacity:1}
.o .ic{width:26px;height:26px;opacity:.7}
.o:hover{outline-color:var(--vien)}
.o.chon{outline-color:var(--brand)}
.o .the-nho{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:rgba(10,15,30,.6);color:#fff;z-index:1}
.o .ghim{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:6px;background:rgba(10,15,30,.6);color:#fff;display:flex;align-items:center;justify-content:center;z-index:1}
.o .ghim .ic{width:13px;height:13px;opacity:1}
.o .ghim.ai.moi{background:#e5484d}
.o .ghim.ai{width:auto;padding:0 6px;font-size:10.5px;font-weight:700;letter-spacing:.3px;background:var(--brand)}
video.phat{display:block;width:100%;height:300px;background:#000;border-radius:10px;object-fit:contain}
.loi-phat{font-size:12.5px;color:var(--vang);margin-top:6px}
.loi-phat:empty{display:none}
.phu-kin{position:fixed;inset:0;background:rgba(5,8,15,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:48px 24px 24px}
.phu-kin video,.phu-kin img{max-width:100%;max-height:100%;border-radius:8px;background:#000}
.phu-kin .dong{position:absolute;top:12px;right:16px;background:rgba(255,255,255,.12);border:0;color:#fff}
.phu-kin .ten-kin{position:absolute;top:18px;left:24px;color:#cfd6e4;font-size:13px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-ai{margin:12px 0 6px;font-size:13.5px;line-height:1.5}
.the-nd{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.the-nd span{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--brand-nhat);color:var(--brand-chu);cursor:pointer}
.the-nd span:hover{text-decoration:underline}
.ten{font-size:12.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duong{font-size:11.5px;color:var(--nhat);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.giua{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.trong{padding:40px 0;text-align:center;color:var(--nhat)}
.xem{position:sticky;top:16px}
.xem .o{aspect-ratio:auto;height:300px;cursor:default}
.xem .o img{object-fit:contain}
.xem .o .ic{width:40px;height:40px}
.xem h3{margin:12px 0 4px;font-size:15px;word-break:break-all}
.vet{display:flex;flex-wrap:wrap;gap:2px 4px;font-size:12.5px;color:var(--phu);margin-bottom:6px}
.vet a{color:var(--brand-chu);cursor:pointer}
.vet a:hover{text-decoration:underline}
.bang{width:100%;font-size:12.5px;border-collapse:collapse;margin:8px 0 12px}
.bang td{padding:4px 0;border-top:1px solid var(--vien)}
.bang td:first-child{color:var(--nhat)}
.bang td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.nut{display:flex;flex-wrap:wrap;gap:6px}
.so-do{overflow-x:auto}
.so-do svg{display:block}
.nut-cay{cursor:pointer}
.nut-cay rect.nen{fill:var(--the);stroke:var(--vien);stroke-width:1}
.nut-cay:hover rect.nen{stroke:var(--brand)}
.nut-cay.mo rect.nen{fill:var(--brand-nhat);stroke:transparent}
.nut-cay.dang rect.nen{stroke:var(--brand);stroke-width:2}
.nut-cay text{fill:var(--chu);font-size:12.5px}
.nut-cay .dem{fill:var(--nhat);font-size:11.5px}
.nut-cay.mo text{fill:var(--brand-chu)}
.nut-cay .thanh{fill:var(--brand);opacity:.22}
.day-noi{stroke:var(--vien);fill:none;stroke-width:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1a2233;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.hien{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){.day{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.giua{grid-template-columns:minmax(0,1fr)}.xem{position:static}}
/* ===== ĐIỆN THOẠI: đo ở 390px trang dài 7.153px, kết quả bắt đầu ở màn thứ 2, Xem nhanh nằm
   cách chỗ bấm 7 màn. Nguyên tắc: ô tìm luôn trong tầm tay, không có số chỉ-để-xem, mọi dải
   chọn trượt NGANG một hàng, bấm ảnh là mở tấm xem nhanh từ dưới lên ngay tại chỗ. ===== */
#xemNen{display:none}
/* nút chỉ-điện-thoại: lớp .btn của hub đặt display bằng !important nên phải đè cùng cấp */
html:not(#_) .chi-dt{display:none!important}
@media (max-width:640px){
  /* mobile-chung.css đặt html,body{overflow-x:hidden} — theo luật CSS thế là <body> thành một vùng
     cuộn riêng (overflow-y tự thành auto), mà trang lại cuộn ở <html> → sticky bám nhầm vào body và
     ô tìm trôi mất. `clip` chặn tràn ngang y như vậy nhưng KHÔNG tạo vùng cuộn. */
  @supports (overflow:clip){html,body{overflow-x:clip}}
  .khung{padding:8px 12px calc(var(--ios-duoi,0px) + 28px);gap:12px}
  .the{padding:12px 14px}
  /* bỏ khối số tổng + dòng giờ quét: không phải việc cần làm, tốn 100px đầu màn */
  #tong,#quet,.the-dau-tim{display:none!important}
  .the-tim{position:sticky;top:0;z-index:12;margin:0 -12px;border-radius:0 0 14px 14px;border-top:0;padding:10px 12px 8px}
  .tim{margin-top:0}
  /* mọi dải chọn: một hàng trượt ngang, không xuống dòng */
  #loc,#locNb,#spChon{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  #loc::-webkit-scrollbar,#locNb::-webkit-scrollbar,#spChon::-webkit-scrollbar{display:none}
  #loc{margin-top:8px}
  #loc .ngan{display:none}
  .the-nb .dau{flex-direction:column;align-items:stretch;gap:8px;margin-bottom:10px}
  /* Nổi bật: MỘT hàng trượt, hé thẻ kế tiếp để biết còn nữa */
  .day{display:grid;grid-auto-flow:column;grid-auto-columns:44%;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    margin:0 -14px;padding:0 14px;gap:10px}
  .day::-webkit-scrollbar{display:none}
  .day>div{scroll-snap-align:start}
  .luoi{gap:10px}
  .ten{font-size:13px}
  #themNua{width:100%;justify-content:center}
  /* Xem nhanh = tấm trượt từ dưới lên, ĐỤC hẳn, chừa thanh tab của hub */
  #xemNen{display:block;position:fixed;inset:0;background:rgba(10,15,30,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  html.xem-mo #xemNen{opacity:1;pointer-events:auto}
  .xem{position:fixed!important;left:0;right:0;bottom:0;top:auto;z-index:31;max-height:88vh;overflow:auto;overscroll-behavior:contain;
    border-radius:18px 18px 0 0;border:0;padding:8px 16px calc(var(--ios-duoi,0px) + env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(10,15,30,.25)}
  html.xem-mo .xem{transform:none}
  .xem::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--vien);margin:2px auto 8px}
  html:not(#_) .chi-dt{display:inline-flex!important}
  video.phat,.xem .o{height:auto;aspect-ratio:16/10;max-height:44vh}
  .xem .nut .btn{flex:1 1 44%;justify-content:center}
  /* Sơ đồ kho gập sẵn — ít ai mở trên điện thoại, mở ra là 480px */
  .the-cay.gap .so-do{display:none}
  html:not(#_) .the-cay.gap #dongHet,html:not(#_) .the-cay:not(.gap) #moCay{display:none!important}
}
/* Chuẩn điện thoại của Marketing Hub: chữ đọc được ≥13px (nhãn nhỏ trên ảnh cũng vậy) */
@media (max-width:640px){
  .nhan,.tong span,.so,.duong,.o .the-nho,.o .ghim.ai,.the-nd span,.bang td{font-size:13px}
  .o .ghim.ai{height:24px}
  .gy-dong{min-height:44px}.gy-ten{font-size:15px}.gy-loai,.gy-n,.gy-nhom{font-size:13px}
  .goi-y{max-height:58vh}
  .tong b{font-size:18px}
}
@media (max-width:520px){.day,.luoi{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="khung">

  <div class="the the-tim">
    <div class="dau the-dau-tim" style="margin-bottom:0">
      <div class="tong" id="tong"></div>
      <span class="so" id="quet"></span>
    </div>
    <div class="tim">
      <div class="o-tim-boc">
      <label class="o-tim">
        <svg class="ic" viewBox="0 0 24 24" style="color:var(--nhat)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="Tìm ảnh, video… vd: đoàn sân bay, hoàng hôn Hòn Thơm" autocomplete="off" spellcheck="false"
          role="combobox" aria-expanded="false" aria-controls="goiY" aria-autocomplete="list">
        <button type="button" class="o-tim-xoa" id="xoaQ" aria-label="Xoá" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </label>
      <div class="goi-y" id="goiY" role="listbox" hidden></div>
      </div>
      <button class="btn primary chinh" id="nutTim">Tìm</button>
    </div>
    <div class="loc" id="loc"></div>
  </div>

  <div class="the the-nb">
    <div class="dau">
      <p class="nhan">Nổi bật</p>
      <div class="loc" id="locNb" style="margin:0"></div>
    </div>
    <div class="loc" id="spChon" style="margin:0 0 12px"></div>
    <div class="day" id="noiBat"><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:74%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:62%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:56%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:80%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:88%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:50%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:62%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:70%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:80%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:64%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:50%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:74%;margin-top:6px"></span></div></div>
  </div>

  <div class="giua">
    <div class="the">
      <div class="dau">
        <p class="nhan">Kết quả</p>
        <span class="so" id="dem"></span>
      </div>
      <div class="luoi" id="luoi"><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:74%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:62%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:56%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:80%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:88%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:50%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:62%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:70%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:80%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:64%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:50%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:74%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:70%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:56%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:64%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:88%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:74%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:62%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:56%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:80%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:88%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:50%;margin-top:6px"></span></div><div><span class="kx" style="display:block;aspect-ratio:4/3;border-radius:10px"></span><span class="kx kx-chu" style="width:62%;margin-top:8px"></span><span class="kx kx-chu nho" style="width:70%;margin-top:6px"></span></div></div>

</div>

<script src="khung-xuong.js?v=BUILD"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const api = (p, o) => fetch(p + (o ? '?' + new URLSearchParams(o) : '')).then(r => r.json());
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const so = n => Number(n).toLocaleString('vi-VN');
const IC = {
  v: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>',
  a: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>',
  r: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  pin: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3H7l3-3zM12 12v8"/></svg>',
  x: '<svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  mo: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  tm: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  tai: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  to: '<svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  link: '<svg class="ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
};
const TEN_LOAI = { v: 'Video', a: 'Ảnh', r: 'Ảnh RAW' };
/* Tên thư mục trên Drive viết HOA và có số thứ tự — hiển thị cho dễ đọc, dữ liệu gửi đi giữ nguyên */
const dep = s => { const t = s.replace(/^\d+\.\s*/, ''); return t === t.toUpperCase() && /[A-ZÀ-Ỹ]/.test(t) ? t.charAt(0) + t.slice(1).toLowerCase() : t; };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('hien'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('hien'), 1800); }

let ghim = [];
try { ghim = JSON.parse(localStorage.getItem('kho.ghim') || '[]'); } catch (e) {}
const luuGhim = () => { try { localStorage.setItem('kho.ghim', JSON.stringify(ghim)); } catch (e) {} };
const S = { q: '', loai: '', nam: '', ai: '', daGan: 0, dsSp: [], sp: '', dsTn: [], chiGoogle: [], tnId: '', duong: [], nb: 'ai', items: [], tong: 0, chon: null, mo: new Set(), cay: new Map(), kho: [] };
const DA_BIET = new Map();

function anh(m, co) {
  const d = m.loai === 'v' ? '<span class="the-nho">Video</span>' : m.loai === 'r' ? '<span class="the-nho">RAW</span>' : '';
  const g = ghim.includes(m.t) ? '<span class="ghim">' + IC.pin + '</span>'
    : m.tn && m.tn.moi ? '<span class="ghim ai moi">Mới</span>' : m.mo ? '<span class="ghim ai">AI</span>' : '';
  const img = m.loai === 'r' ? '' : '<img loading="lazy" alt="" src="api/anh/' + m.t + (co ? '?c=' + co : '') + '" onload="this.classList.add(\'xong\')" onerror="this.remove()">';
  return IC[m.loai] + img + d + g;
}
/* Nhãn "đang ở đâu": bỏ qua các cấp chỉ là năm/tháng/ngày, lấy tên địa điểm gần nhất */
const LA_NGAY = /^(20\d\d|tháng.*|t\d{1,2}|\d{1,2}([.\/／-]\d{1,4}){0,2})$/i;
const noiChup = m => m.duong.slice(1).find(s => !LA_NGAY.test(s.trim())) || m.duong[0];
function o(m, nb) {
  DA_BIET.set(m.t, m);
  return '<div data-t="' + m.t + '"><div class="o' + (S.chon === m.t ? ' chon' : '') + '">' + anh(m) + '</div>' +
    /* Dòng chính = NỘI DUNG (mô tả AI) hoặc NƠI CHỤP; tên file máy đặt (DJI_2026…, IMG_…) không nói
       gì với người xem nên chỉ đứng cuối dòng phụ, để còn đối chiếu khi cần. */
    '<div class="ten" title="' + esc(m.mo || m.ten) + '">' + esc(m.mo || dep(noiChup(m))) + '</div>' +
    '<div class="duong">' + esc(nb ? dep(m.duong[0]) + (m.nam ? ' · ' + m.nam : '')
      : [m.mo ? dep(noiChup(m)) : dep(m.duong[m.duong.length - 1] || ''), m.nam, m.ten].filter((x, k, a) => x && a.indexOf(x) === k && !(k === 0 && x === dep(noiChup(m)) && !m.mo)).join(' · ')) + '</div></div>';
}

/* ---------- vẽ ---------- */
function veLoc() {
  const c = [];
  if (S.duong.length) c.push('<button type="button" class="pill chip on" data-bo="1">Trong: ' + esc(S.duong.map(dep).join(' › ')) + ' ' + IC.x + '</button><span class="ngan"></span>');
  [['', 'Tất cả'], ['v', 'Video'], ['a', 'Ảnh'], ['r', 'RAW']].forEach(([k, t]) => c.push('<button type="button" class="pill chip' + (S.loai === k ? ' on' : '') + '" data-loai="' + k + '">' + t + '</button>'));
  if (S.daGan) c.push('<button type="button" class="pill chip' + (S.ai ? ' on' : '') + '" data-ai="1">AI đã xem · ' + so(S.daGan) + '</button>');
  c.push('<span class="ngan"></span>');
  S.kho.slice(0, 8).forEach(k => c.push('<button type="button" class="pill chip' + (S.duong.length === 1 && S.duong[0] === k.ten ? ' on' : '') + '" data-kho="' + esc(k.ten) + '">' + esc(dep(k.ten)) + '</button>'));
  c.push('<span class="ngan"></span>');
  ['2026', '2025', '2024', '2023', '2022'].forEach(n => c.push('<button type="button" class="pill chip' + (S.nam === n ? ' on' : '') + '" data-nam="' + n + '">' + n + '</button>'));
  $('loc').innerHTML = c.join('');
  const ngayNgan = t => { const d = new Date(t); return d.getDate() + '/' + (d.getMonth() + 1); };
  if (S.nb === 'tn') {
    $('spChon').innerHTML = S.dsTn.slice(0, 14).map(l => '<button type="button" class="pill chip' + (S.tnId === l.id ? ' on' : '') + '" data-tn="' + l.id + '" title="' + esc((l.nguoi || []).join(', ')) + '">' +
      (l.moi ? '<b class="nhan-moi">Mới</b> · ' : '') + ngayNgan(l.kt) + ' · ' + esc(l.ten.length > 38 ? l.ten.slice(0, 37) + '…' : l.ten) + ' · ' + so(l.n) + '</button>').join('') +
      (S.chiGoogle.length ? '<span class="so" style="margin-left:4px" title="' + esc(S.chiGoogle.map(x => x.ten).join('\n')) + '">' + S.chiGoogle.length + ' lịch chỉ có link Google Drive, chưa đọc được</span>' : '');
    $('spChon').style.display = '';
  } else
  $('spChon').innerHTML = S.nb === 'sp' ? S.dsSp.map(s => '<button type="button" class="pill chip' + (S.sp === s.ma ? ' on' : '') + '" data-sp="' + esc(s.ma) + '">' +
    (s.day ? '<b class="nhan-moi">Ưu tiên</b> · ' : '') + esc(s.ten) + '</button>').join('') : '';
  if (S.nb !== 'tn') $('spChon').style.display = S.nb === 'sp' ? '' : 'none';
  $('locNb').innerHTML = (S.dsTn.length ? [['tn', 'Mới từ tác nghiệp']] : []).concat(S.dsSp.length ? [['sp', 'Theo sản phẩm đang bán']] : []).concat([['ai', 'AI chọn'], ['goi-y', 'Gợi ý hôm nay'], ['moi', 'Mới nhất'], ['ghim', 'Được ghim · ' + ghim.length]])
    .map(([k, t]) => '<button type="button" class="pill chip' + (S.nb === k ? ' on' : '') + '" data-nb="' + k + '">' + t + '</button>').join('');
}

async function veNoiBat() {
  const r = S.nb === 'ghim'
    ? (ghim.length ? await api('api/theo-token', { ds: ghim.slice(-12).reverse().join(',') }) : { items: [] })
    : await api('api/goi-y', { kieu: S.nb, n: 12, ma: S.sp || '', id: S.tnId || '' });
  const trong = S.nb === 'ghim' ? 'Chưa ghim media nào' : 'Chưa có media khớp sản phẩm này';
  $('noiBat').innerHTML = r.items.length ? r.items.map(m => o(m, true)).join('') : '<div class="trong" style="grid-column:1/-1">' + trong + '</div>';
}

/* Ghi nhận để tìm kiếm tự học: media được bấm/phát/tải/ghim sau một lần tìm sẽ lên hạng cho câu đó */
function ghiSk(loai, t, them) {
  if (!S.q.trim() && loai !== 'tim') return;
  try { fetch('api/su-kien', { method: 'POST', keepalive: true, body: JSON.stringify(Object.assign({ loai, q: S.q, t }, them || {})) }); } catch (e) {}
}
let henGhiTim, daGhiTim = '';
function ghiLanTim(tong) {
  clearTimeout(henGhiTim);
  const q = S.q.trim();
  if (!q) return;
  /* đợi người gõ dừng 2,5 giây mới ghi, để không ghi "đ", "đo", "đoà"… */
  henGhiTim = setTimeout(() => { if (S.q.trim() === q && q !== daGhiTim) { daGhiTim = q; ghiSk('tim', null, { tong }); } }, 2500);
}

let luot = 0;
async function timMoi() {
  const l = ++luot;
  const r = await api('api/tim', { q: S.q, loai: S.loai, nam: S.nam, ai: S.ai, duong: JSON.stringify(S.duong), tu: 0 });
  if (l !== luot) return;
  S.items = r.items; S.tong = r.tong;
  $('dem').textContent = (r.ganDung ? 'Không có kết quả khớp đủ · ' + so(r.tong) + ' kết quả gần đúng' : so(r.tong) + ' kết quả') + ' · ' + so(r.video) + ' video';
  ghiLanTim(r.tong);
  if (!S.items.find(m => m.t === S.chon)) S.chon = S.items[0] ? S.items[0].t : null;
  veLuoi(); veXem();
}
async function themNua() {
  const r = await api('api/tim', { q: S.q, loai: S.loai, nam: S.nam, ai: S.ai, duong: JSON.stringify(S.duong), tu: S.items.length });
  S.items = S.items.concat(r.items); veLuoi();
}
async function veLuoi() {
  if (!S.items.length && (S.duong.length || S.loai || S.nam || S.ai)) {
    /* bộ lọc đang che: báo toàn kho có bao nhiêu để khỏi tưởng là không có */
    const l = luot;
    const r = await api('api/tim', { q: S.q, tu: 0 });
    if (l !== luot) return;
    $('luoi').innerHTML = '<div class="trong" style="grid-column:1/-1">Không có trong bộ lọc đang chọn' +
      (r.tong ? ' · toàn kho có ' + so(r.tong) + ' kết quả<br><br><button class="btn primary chinh" data-bo-het="1">Tìm trong toàn kho</button>' : '') + '</div>';
    $('themNua').style.display = 'none';
    return;
  }
  $('luoi').innerHTML = S.items.length ? S.items.map(m => o(m)).join('') : '<div class="trong" style="grid-column:1/-1">Không tìm thấy</div>';
  $('themNua').style.display = S.tong > S.items.length ? '' : 'none';
}
function veXem() {
  const m = DA_BIET.get(S.chon);
  if (!m) { $('xem').innerHTML = '<p class="nhan">Xem nhanh</p><div class="trong">Chọn một media</div>'; return; }
  const vet = m.duong.map((p, i) => '<a data-vet="' + i + '">' + esc(dep(p)) + '</a>').join('<span>›</span>');
  const ngay = new Date(m.mod * 1000).toLocaleDateString('vi-VN');
  const khung = m.loai === 'v'
    ? '<video class="phat" controls preload="none" playsinline poster="api/anh/' + m.t + '?c=middle" src="api/phat/' + m.t + '"></video>'
    : '<div class="o" data-to="1" style="cursor:zoom-in">' + anh(m, 'middle') + '</div>';
  const tai = m.loai === 'v'
    ? '<a class="btn nut-a" href="api/tai/' + m.t + '?ban=1080" download data-sk-tai="' + m.t + '">' + IC.tai + 'Tải bản 1080p</a><button class="btn" data-goc="' + m.t + '">' + IC.tai + 'Tải file gốc</button>'
    : '<button class="btn" data-goc="' + m.t + '">' + IC.tai + (m.loai === 'r' ? 'Tải file RAW' : 'Tải ảnh gốc') + '</button>';
  $('xem').innerHTML = '<div class="dau" style="margin-bottom:10px"><p class="nhan">Xem nhanh</p><span style="display:flex;gap:6px">' + (m.loai !== 'r' ? '<button class="btn" data-to="1" style="height:28px">' + IC.to + 'Phóng to</button>' : '') + '<button class="btn chi-dt" data-dong-xem="1" style="height:28px">Đóng</button></span></div>' +
    khung + '<div class="loi-phat" id="loiPhat"></div>' +
    '<div class="nut" style="margin-top:10px">' + tai + '</div>' +
    (m.mo ? '<p class="mo-ai">' + esc(m.mo) + '</p><div class="the-nd">' + m.the.map(t => '<span data-tag="' + esc(t) + '">' + esc(t) + '</span>').join('') + '</div>' : '') +
    '<h3>' + esc(m.ten) + '</h3><div class="vet">' + vet + '</div>' +
    '<table class="bang"><tr><td>Loại</td><td>' + TEN_LOAI[m.loai] + '</td></tr><tr><td>Năm (theo thư mục)</td><td>' + (m.nam || '—') + '</td></tr><tr><td>Tải lên Drive</td><td>' + ngay + '</td></tr>' +
    (m.tn ? '<tr><td>Lịch tác nghiệp</td><td><a data-tn-xem="' + m.tn.id + '" style="color:var(--brand-chu);cursor:pointer">' + esc(m.tn.ten.length > 32 ? m.tn.ten.slice(0, 31) + '…' : m.tn.ten) + '</a></td></tr>' : '') + (m.diem ? '<tr><td>Điểm AI</td><td>' + m.diem + ' / 10</td></tr>' : '') + '</table>' +
    '<div class="nut"><a class="btn primary nut-a chinh" href="' + m.url + '" target="_blank" rel="noopener">' + IC.mo + 'Mở file</a>' +
    (m.tm ? '<a class="btn nut-a" href="' + m.tm + '" target="_blank" rel="noopener">' + IC.tm + 'Thư mục</a>' : '') +
    '<button class="btn" data-lam="link">' + IC.link + 'Copy link</button><button class="btn" data-lam="ghim">' + IC.pin + (ghim.includes(m.t) ? 'Bỏ ghim' : 'Ghim') + '</button></div>';
  ganLoiPhat();
}

/* ---------- sơ đồ: nạp nhánh con khi bung ---------- */
const khoa = d => JSON.stringify(d);
async function napNhanh(d) {
  if (!S.cay.has(khoa(d))) S.cay.set(khoa(d), await api('api/cay', { duong: JSON.stringify(d) }));
  return S.cay.get(khoa(d));
}
function veSoDo() {
  const W = 200, BUOC = 228, H = 30, GAP = 7;
  const nut = []; const day = []; let y = 0; let sau = 0;
  function dat(ten, d, n, coCon) {
    const k = khoa(d);
    const node = { ten, d, n, cap: d.length, coCon, y: 0 };
    sau = Math.max(sau, d.length);
    const con = S.mo.has(k) && S.cay.get(k) ? S.cay.get(k).con : [];
    if (con.length) {
      const ys = con.map(c => { const cn = dat(c.ten, d.concat(c.ten), c.n, c.coCon); day.push([node, cn]); return cn.y; });
      node.y = (ys[0] + ys[ys.length - 1]) / 2;
    } else { node.y = y; y += H + GAP; }
    nut.push(node);
    return node;
  }
  const goc = S.cay.get(khoa([]));
  if (!goc) return;
  dat(goc.ten, [], goc.n, true);
  const rong = sau * BUOC + W + 4, cao = y;
  const cha = new Map(); for (const [a, b] of day) cha.set(b, a);
  let s = '';
  for (const [a, b] of day) {
    const x1 = a.cap * BUOC + W, y1 = a.y + H / 2, x2 = b.cap * BUOC, y2 = b.y + H / 2;
    s += '<path class="day-noi" d="M' + x1 + ' ' + y1 + ' C' + (x1 + 16) + ' ' + y1 + ' ' + (x2 - 16) + ' ' + y2 + ' ' + x2 + ' ' + y2 + '"/>';
  }
  const dang = khoa(S.duong);
  for (const n of nut) {
    const x = n.cap * BUOC;
    const anhEm = cha.get(n) ? Math.max(...day.filter(p => p[0] === cha.get(n)).map(p => p[1].n)) : n.n;
    const lop = 'nut-cay' + (S.mo.has(khoa(n.d)) ? ' mo' : '') + (khoa(n.d) === dang && n.d.length ? ' dang' : '');
    const ten = dep(n.ten).length > 21 ? dep(n.ten).slice(0, 20) + '…' : dep(n.ten);
    s += '<g class="' + lop + '" data-d="' + esc(khoa(n.d)) + '" data-con="' + (n.coCon ? 1 : 0) + '"><title>' + esc(n.d.join(' › ') || n.ten) + '</title>' +
      '<rect class="nen" x="' + x + '" y="' + n.y + '" width="' + W + '" height="' + H + '" rx="8"/>' +
      '<rect class="thanh" x="' + (x + 1) + '" y="' + (n.y + H - 4) + '" width="' + Math.max(3, (W - 2) * n.n / anhEm) + '" height="3" rx="1.5"/>' +
      '<text x="' + (x + 10) + '" y="' + (n.y + 19.5) + '"' + (n.cap === 0 ? ' font-weight="700"' : '') + '>' + esc(ten) + (n.coCon && !S.mo.has(khoa(n.d)) && n.cap ? ' ›' : '') + '</text>' +
      '<text class="dem" x="' + (x + W - 10) + '" y="' + (n.y + 19.5) + '" text-anchor="end">' + so(n.n) + '</text></g>';
  }
  $('soDo').innerHTML = '<svg width="' + rong + '" height="' + cao + '" viewBox="0 0 ' + rong + ' ' + cao + '">' + s + '</svg>';
}

/* ---------- phát, phóng to, tải ---------- */
function ganLoiPhat() {
  const v = document.querySelector('#xem video.phat');
  if (v) v.addEventListener('play', () => ghiSk('phat', S.chon), { once: true });
  if (v) v.addEventListener('error', () => { $('loiPhat').textContent = 'Không phát được video này trên trình duyệt. Bấm Mở file để xem trên Lark.'; });
}
function phongTo() {
  const m = DA_BIET.get(S.chon);
  if (!m || m.loai === 'r') return;
  const v = document.querySelector('#xem video.phat');
  const luc = v ? v.currentTime : 0;
  if (v) v.pause();
  const d = document.createElement('div');
  d.className = 'phu-kin';
  d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');   // hub tự làm mờ thanh tab/đầu
  d.innerHTML = '<span class="ten-kin">' + esc(m.mo || m.ten) + '</span><button class="dong">' + IC.x.replace('12px', '16px') + 'Đóng</button>' +
    (m.loai === 'v' ? '<video controls autoplay playsinline src="api/phat/' + m.t + '"></video>' : '<img alt="" src="api/anh/' + m.t + '?c=middle">');
  document.body.appendChild(d);
  const vk = d.querySelector('video');
  if (vk && luc) vk.addEventListener('loadedmetadata', () => { vk.currentTime = luc; }, { once: true });
}
function dongKin() { const d = document.querySelector('.phu-kin'); if (d) d.remove(); }
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (document.querySelector('.phu-kin')) dongKin(); else dongXem(); });

/* ---------- điện thoại: tấm xem nhanh trượt từ dưới lên ----------
   role="dialog" CHỈ gắn lúc mở: ios-app.js của hub coi [role=dialog] đang hiện là cửa sổ mở và tự
   làm mờ thanh tab/thanh đầu — cùng một kiểu với mọi cửa sổ khác trong hệ. */
const laDT = () => window.matchMedia('(max-width:640px)').matches;
function moXem() {
  if (!laDT()) return;
  document.documentElement.classList.add('xem-mo');
  const x = $('xem'); x.setAttribute('role', 'dialog'); x.setAttribute('aria-modal', 'true'); x.scrollTop = 0;
}
function dongXem() {
  if (!document.documentElement.classList.contains('xem-mo')) return;
  document.documentElement.classList.remove('xem-mo');
  const x = $('xem'); x.removeAttribute('role'); x.removeAttribute('aria-modal');
  const v = x.querySelector('video'); if (v) v.pause();
}
$('xemNen').addEventListener('click', dongXem);
/* vuốt xuống ở đầu tấm (khi đã cuộn lên đỉnh) là đóng */
(() => {
  let y0 = null;
  $('xem').addEventListener('touchstart', e => { y0 = $('xem').scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  $('xem').addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy > 0) $('xem').style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });
  $('xem').addEventListener('touchend', e => {
    if (y0 == null) return;
    const dy = (e.changedTouches[0].clientY - y0); y0 = null;
    $('xem').style.transform = '';
    if (dy > 90) dongXem();
  });
})();
const MB = b => (b / 1048576).toFixed(b > 104857600 ? 0 : 1) + ' MB';
async function taiGoc(nut) {
  if (nut.dataset.dang) return;
  nut.dataset.dang = '1';
  const t = nut.dataset.goc, nhan = nut.innerHTML;
  const cho = ms => new Promise(r => setTimeout(r, ms));
  try {
    for (;;) {
      const tt = await api('api/tai-tt/' + t);
      if (tt.loi) { toast(tt.loi); break; }
      if (tt.xong) {
        const a = document.createElement('a'); a.href = 'api/tai/' + t; a.download = ''; document.body.appendChild(a); a.click(); a.remove();
        toast('Đang lưu file gốc về máy'); break;
      }
      nut.innerHTML = IC.tai + 'Đang lấy từ Drive · ' + MB(tt.daTai);
      await cho(1000);
    }
  } finally { nut.innerHTML = nhan; delete nut.dataset.dang; }
}

function chonDuong(d, cuon) {
  S.duong = d; S.chon = null;
  if (S.q) { S.q = ''; $('q').value = ''; }
  veLoc(); timMoi(); veSoDo();
  if (cuon) document.querySelector('.giua').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- sự kiện ---------- */
let hen;
/* ---------- gợi ý khi gõ ---------- */
const GY = { ds: [], chon: -1, luot: 0, mo: false };
const TEN_GY = { kho: 'Kho', noi: 'Địa điểm', the: 'Nội dung', lich: 'Lịch tác nghiệp', hay: 'Hay tìm', gan: 'Vừa tìm' };
const IC_GY = {
  kho: IC.tm, noi: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.4-6.5-11a6.5 6.5 0 0 1 13 0c0 5.6-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  the: '<svg class="ic" viewBox="0 0 24 24"><path d="M3.5 12.5V5a1.5 1.5 0 0 1 1.5-1.5h7.5l8 8-9 9z"/><circle cx="8" cy="8" r="1.3"/></svg>',
  lich: '<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  hay: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-7"/><path d="M15 8h5v5"/></svg>',
  gan: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
};
let ganDay = [];
try { ganDay = JSON.parse(localStorage.getItem('kho.ganDay') || '[]'); } catch (e) {}
function nhoTim(q) {
  q = q.trim(); if (!q) return;
  ganDay = [q].concat(ganDay.filter(x => x.toLowerCase() !== q.toLowerCase())).slice(0, 6);
  try { localStorage.setItem('kho.ganDay', JSON.stringify(ganDay)); } catch (e) {}
}
/* Tô đậm đúng các từ đã gõ, so KHÔNG dấu nhưng tô trên chữ CÓ dấu (bỏ dấu từng chữ một
   nên vị trí hai chuỗi khớp nhau) */
const boChu = c => c.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
function toDam(ten, q) {
  /* tên thư mục trên Drive có khi lưu dấu dạng TỔ HỢP (o + dấu huyền riêng): chuẩn về dạng dựng sẵn
     trước, nếu không một chữ "ò" thành hai phần tử và vị trí tô lệch dần */
  ten = String(ten).normalize('NFC');
  const tu = boChu(q).split(/\s+/).filter(Boolean);
  const kh = [...ten].map(boChu).join('');
  const dau = new Array(ten.length).fill(false);
  for (const t of tu) {
    let i = -1;
    while ((i = kh.indexOf(t, i + 1)) !== -1) {
      if (i === 0 || /[^a-z0-9]/.test(kh[i - 1])) { for (let k = i; k < i + t.length; k++) dau[k] = true; break; }
    }
  }
  let h = '', mo = false;
  [...ten].forEach((c, i) => { if (dau[i] !== mo) { h += dau[i] ? '<b>' : '</b>'; mo = dau[i]; } h += esc(c); });
  return h + (mo ? '</b>' : '');
}
function veGoiY(ds, nhom, the) {
  GY.ds = ds; GY.chon = -1;
  const q = $('q').value;
  const dong = (x, i) => '<div class="gy-dong" role="option" id="gy-' + i + '" data-gy="' + i + '">' + (IC_GY[x.loai] || IC_GY.the) +
    '<span class="gy-ten">' + (q.trim() ? toDam(x.ten, q) : esc(x.ten)) + '</span><span class="gy-loai">' + TEN_GY[x.loai] + '</span>' +
    (x.n && x.loai !== 'gan' ? '<span class="gy-n">' + so(x.n) + '</span>' : '') + '</div>';
  let h = '', i = 0;
  if (nhom) { for (const [ten, a] of nhom) if (a.length) { h += '<div class="gy-nhom">' + ten + '</div>' + a.map(x => dong(x, i++)).join(''); } }
  else h = ds.map(dong).join('');
  if (the && the.length) h += '<div class="gy-nhom">Nội dung phổ biến</div><div class="gy-chips">' + the.map(x => '<button type="button" class="pill chip" data-gy-the="' + esc(x.ten) + '">' + esc(x.ten) + '</button>').join('') + '</div>';
  if (!h) h = q.trim() ? '<div class="gy-trong">Không có gợi ý — nhấn Enter để tìm "' + esc(q.trim()) + '"</div>' : '';
  $('goiY').innerHTML = h;
  moGoiY(!!h);
}
function moGoiY(co) { GY.mo = co; $('goiY').hidden = !co; $('q').setAttribute('aria-expanded', co ? 'true' : 'false'); }
async function napGoiY() {
  const l = ++GY.luot, q = $('q').value;
  const r = await api('api/goi-y-tim', { q });
  if (l !== GY.luot || document.activeElement !== $('q')) return;
  if (!q.trim()) {
    const gan = ganDay.map(t => ({ ten: t, loai: 'gan' }));
    const daCo = new Set(ganDay.map(t => t.toLowerCase()));
    const hay = (r.ds || []).filter(x => !daCo.has(x.ten.toLowerCase())).slice(0, 5);
    veGoiY(gan.concat(hay), [['Vừa tìm', gan], ['Cả phòng hay tìm', hay]], r.the);
  } else veGoiY(r.ds || []);
}
function chonGoiY(i) {
  GY.chon = i;
  document.querySelectorAll('#goiY .gy-dong').forEach((d, k) => d.classList.toggle('chon', k === i));
  const d = $('gy-' + i); if (d) { d.scrollIntoView({ block: 'nearest' }); $('q').setAttribute('aria-activedescendant', d.id); }
}
function timNgay(q) {
  clearTimeout(hen); clearTimeout(henGy);
  $('q').value = q; S.q = q; $('xoaQ').hidden = !q;
  moGoiY(false); nhoTim(q); timMoi();
}
let henGy;
$('q').addEventListener('input', e => {
  $('xoaQ').hidden = !e.target.value;
  clearTimeout(henGy); henGy = setTimeout(napGoiY, 110);
  clearTimeout(hen); hen = setTimeout(() => { S.q = e.target.value; timMoi(); }, 250);
});
$('q').addEventListener('focus', () => { if (!GY.mo) napGoiY(); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && GY.mo && GY.ds.length) { e.preventDefault(); chonGoiY((GY.chon + 1) % GY.ds.length); return; }
  if (e.key === 'ArrowUp' && GY.mo && GY.ds.length) { e.preventDefault(); chonGoiY(GY.chon <= 0 ? GY.ds.length - 1 : GY.chon - 1); return; }
  if (e.key === 'Escape' && GY.mo) { e.stopPropagation(); moGoiY(false); return; }
  if (e.key === 'Enter') { e.preventDefault(); timNgay(GY.mo && GY.chon >= 0 ? GY.ds[GY.chon].ten : e.target.value); e.target.blur(); }
});
/* mousedown (không phải click): bấm dòng gợi ý trước khi ô nhập mất tiêu điểm */
$('goiY').addEventListener('mousedown', e => {
  const d = e.target.closest('[data-gy]'), c = e.target.closest('[data-gy-the]');
  if (!d && !c) return;
  e.preventDefault();
  timNgay(d ? GY.ds[+d.dataset.gy].ten : c.dataset.gyThe);
});
document.addEventListener('mousedown', e => { if (GY.mo && !e.target.closest('.o-tim-boc')) moGoiY(false); });
$('xoaQ').addEventListener('mousedown', e => { e.preventDefault(); timNgay(''); $('q').focus(); napGoiY(); });
$('nutTim').onclick = () => timNgay($('q').value);
$('themNua').onclick = themNua;
$('dongHet').onclick = () => { S.mo = new Set([khoa([])]); veSoDo(); };

document.addEventListener('click', async e => {
  if (e.target.closest('[data-bo-het]')) { S.duong = []; S.loai = ''; S.nam = ''; S.ai = ''; veLoc(); veSoDo(); timMoi(); return; }
  if (e.target.closest('[data-dong-xem]')) { dongXem(); return; }
  if (e.target.closest('[data-to]')) { phongTo(); return; }
  if (e.target.closest('.phu-kin .dong') || e.target.classList.contains('phu-kin')) { dongKin(); return; }
  const g = e.target.closest('[data-goc]');
  if (g) { ghiSk('tai', g.dataset.goc); taiGoc(g); return; }
  const skt = e.target.closest('[data-sk-tai]');
  if (skt) ghiSk('tai', skt.dataset.skTai);
  const tnx = e.target.closest('[data-tn-xem]');
  if (tnx) { S.nb = 'tn'; S.tnId = tnx.dataset.tnXem; veLoc(); veNoiBat(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const tnc = e.target.closest('[data-tn]');
  if (tnc) { S.tnId = tnc.dataset.tn; veLoc(); veNoiBat(); return; }
  const spc = e.target.closest('[data-sp]');
  if (spc) { S.sp = spc.dataset.sp; veLoc(); veNoiBat(); return; }
  if (e.target.closest('[data-ai]')) { S.ai = S.ai ? '' : '1'; veLoc(); timMoi(); return; }
  const tag = e.target.closest('[data-tag]');
  if (tag) { S.q = tag.dataset.tag; $('q').value = S.q; S.duong = []; veLoc(); veSoDo(); timMoi(); return; }
  const c = e.target.closest('[data-loai],[data-kho],[data-nam],[data-nb],[data-bo]');
  if (c) {
    const d = c.dataset;
    if (d.nb) { S.nb = d.nb; veLoc(); veNoiBat(); return; }
    if (d.loai !== undefined) S.loai = d.loai;
    if (d.nam) S.nam = S.nam === d.nam ? '' : d.nam;
    if (d.kho) { chonDuong(S.duong[0] === d.kho && S.duong.length === 1 ? [] : [d.kho]); return; }
    if (d.bo) { chonDuong([]); return; }
    veLoc(); timMoi(); return;
  }
  const it = e.target.closest('[data-t]');
  if (it) {
    S.chon = it.dataset.t;
    if (it.closest('#luoi')) ghiSk('bam', S.chon);
    document.querySelectorAll('.o.chon').forEach(x => x.classList.remove('chon'));
    it.querySelector('.o').classList.add('chon');
    veXem();
    if (laDT()) moXem();
    else if (it.closest('#noiBat')) $('xem').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  const v = e.target.closest('[data-vet]');
  if (v) { const m = DA_BIET.get(S.chon); chonDuong(m.duong.slice(0, +v.dataset.vet + 1)); return; }
  const n = e.target.closest('[data-d]');
  if (n) {
    const d = JSON.parse(n.dataset.d); const k = khoa(d);
    if (n.dataset.con === '1') {
      if (S.mo.has(k) && d.length) S.mo.delete(k);
      else { await napNhanh(d); S.mo.add(k); }
    }
    chonDuong(d, false);
    return;
  }
  const l = e.target.closest('[data-lam]');
  if (l) {
    const m = DA_BIET.get(S.chon);
    if (l.dataset.lam === 'ghim') {
      const i = ghim.indexOf(m.t);
      i >= 0 ? ghim.splice(i, 1) : (ghim.push(m.t), ghiSk('ghim', m.t));
      luuGhim(); toast(i >= 0 ? 'Đã bỏ ghim' : 'Đã ghim vào Nổi bật');
      veLoc(); veXem(); veLuoi(); if (S.nb === 'ghim') veNoiBat();
    } else if (l.dataset.lam === 'link') {
      try { await navigator.clipboard.writeText(m.url); toast('Đã copy link file'); } catch (er) { toast(m.url); }
    }
  }
});

if (laDT()) $('theCay').classList.add('gap');
$('moCay').addEventListener('click', () => { $('theCay').classList.remove('gap'); veSoDo(); });
(async () => {
  const [t, goc] = await Promise.all([api('api/tong'), napNhanh([])]);
  $('tong').innerHTML = [['Media', t.media], ['Video', t.video], ['Ảnh', t.anh], ['RAW', t.raw], ['Thư mục', t.thuMuc]]
    .map(([k, v]) => '<div><b>' + so(v) + '</b><span>' + k + '</span></div>').join('');
  $('quet').textContent = 'Quét lúc ' + new Date(t.quetLuc).toLocaleString('vi-VN') + ' · đã loại ' + so(t.nhayCam) + ' file nhạy cảm';
  S.kho = [...goc.con].sort((a, b) => b.n - a.n);
  S.daGan = t.daGan || 0;
  if (!S.daGan && S.nb === 'ai') S.nb = 'goi-y';
  try { S.dsSp = (await api('api/san-pham')).ds || []; } catch (e) { S.dsSp = []; }
  if (S.dsSp.length) { S.nb = 'sp'; S.sp = S.dsSp[0].ma; }
  try { const r = await api('api/tac-nghiep'); S.dsTn = r.ds || []; S.chiGoogle = r.chiGoogle || []; } catch (e) {}
  /* Có lịch vừa xong (≤7 ngày) thì mở thẳng tab tác nghiệp — media mới phải được thấy ngay */
  if (S.dsTn.length) { S.tnId = S.dsTn[0].id; if (S.dsTn[0].moi || !S.dsSp.length) S.nb = 'tn'; }
  S.mo.add(khoa([]));
  veLoc(); veNoiBat(); timMoi(); veSoDo();
})();
</script>
