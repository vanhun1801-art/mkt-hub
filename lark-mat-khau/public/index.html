<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tài khoản &amp; gói dịch vụ</title>
<link rel="stylesheet" href="/styles.css?v=BUILD">
<!-- Luật mobile dùng chung — bản gốc: lark-mkt-hub/public/mobile-chung.css,
     sửa xong chạy dong-bo-khung.js. Phải nằm SAU styles.css. -->
<link rel="stylesheet" href="/mobile-chung.css?v=BUILD">
<link rel="stylesheet" href="/khung-xuong.css?v=BUILD">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">MK</div>
    <div>
      <div class="ten">Tài khoản &amp; gói dịch vụ</div>
      <div class="phu" id="phuDe">đang tải…</div>
    </div>
  </div>

  <div class="pills" id="tabs"></div>

  <span class="sp"></span>
  <div class="top-right">
    <span class="chip" id="chipToi">…</span>
    <button class="btn sm" id="btnLamMoi" title="Đọc lại từ Lark Base">Làm mới</button>
    <button class="btn sm" id="btnBase">Mở Base</button>
  </div>
</header>

<div class="than-trang">
  <main id="man" data-kx-nho="mat-khau">
    <div class="kx-man kx-vung" aria-busy="true" aria-label="Đang nạp danh sách tài khoản"><div class="kx-khoi"><span class="kx" style="height:78px;border-radius:12px"></span></div><div class="kx-khoi"><span class="kx" style="height:44px;border-radius:10px"></span></div><div class="kx-khoi"><span class="kx" style="height:52px;border-radius:10px"></span><span class="kx" style="height:52px;border-radius:10px"></span><span class="kx" style="height:52px;border-radius:10px"></span><span class="kx" style="height:52px;border-radius:10px"></span></div></div>
  </main>

  <!-- ios-tu-luu: app tự giữ nháp ngăn này (app.js, không bao giờ giữ mật khẩu) — lớp nháp chung của hub đứng ngoài. -->
  <aside id="so" class="ios-tu-luu" aria-label="Chi tiết tài khoản">
    <header class="so-dau">
      <b id="soTieuDe">Chi tiết</b>
      <span class="phu" id="soPhu"></span>
      <span class="sp"></span>
      <button class="btn sm" id="soDong" title="Đóng (Esc)">✕</button>
    </header>
    <div class="so-than" id="soThan"></div>
  </aside>
</div>

<div id="toasts"></div>

<script src="/khung-xuong.js?v=BUILD"></script>
<script src="/app.js?v=BUILD"></script>
</body>
</html>
