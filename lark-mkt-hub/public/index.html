<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Hub · Rooty Trip</title>
<meta name="description" content="Một cửa vào cho toàn bộ Lark Base của phòng Marketing Rooty Trip.">
<meta name="theme-color" content="#3370ff">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=BUILD">
<!-- Khung xương (skeleton): phải nằm SAU styles.css để đè được nền/viền của
     thành phần thật mà nó đang giả dạng. -->
<link rel="stylesheet" href="/khung-xuong.css?v=BUILD">
</head>
<body>

<!-- Thanh trên cùng CHỈ hiện trên điện thoại (xem @media 640px trong
     styles.css). Ở đó panel base không còn đứng cạnh nội dung nữa mà trượt ra
     như ngăn kéo, nên cần một chỗ cố định để mở nó ra và để biết đang đứng ở
     app nào — khung app con nằm trong iframe, lớp vỏ không mượn được tiêu đề
     của nó. -->
<header class="mob-bar">
  <button class="mob-nut" id="btnMenu" aria-label="Danh sách ứng dụng" aria-expanded="false">
    <span class="mob-gach"></span>
  </button>
  <b class="mob-ten" id="mobTen">Tổng quan chung</b>
</header>
<div class="rail-nen" id="railNen" hidden></div>

<div class="app" id="app">

  <!-- ============ PANEL BASE (đỏ) ============ -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <a class="logo" href="#/tong-quan" title="Marketing Hub · Rooty Trip">
        <img src="/icon.svg" width="30" height="30" alt="">
        <span class="logo-text">
          <strong id="hubTen">Marketing Hub</strong>
          <small id="hubPhu">Rooty Trip</small>
        </span>
      </a>
      <button class="rail-pin" id="btnPin" title="Thu gọn / mở rộng panel">‹</button>
    </div>

    <!-- Khung xương viết thẳng vào HTML, không dựng bằng JS: nó phải có mặt ở
         NHỊP SƠN ĐẦU TIÊN, mà app.js thì nằm cuối trang và còn chờ DOMContentLoaded.
         Dựng bằng JS thì người dùng vẫn thấy một panel trắng trơn trước đã —
         đúng cái đang muốn bỏ. veRail() ghi đè chỗ này khi /api/hub trả về. -->
    <nav class="rail-nav" id="railNav" aria-busy="true">
      <div class="kx-vung" aria-label="Đang nạp danh sách base">
        <div class="rail-item"><span class="kx kx-o"></span><span class="ri-tx"><span class="kx kx-chu" style="width:74%"></span></span></div>
        <div class="rail-group"><span class="kx kx-chu nho" style="width:56%"></span></div>
        <div class="rail-item"><span class="kx kx-o"></span><span class="ri-tx"><span class="kx kx-chu" style="width:66%"></span></span></div>
        <div class="rail-item"><span class="kx kx-o"></span><span class="ri-tx"><span class="kx kx-chu" style="width:82%"></span></span></div>
        <div class="rail-item"><span class="kx kx-o"></span><span class="ri-tx"><span class="kx kx-chu" style="width:58%"></span></span></div>
        <div class="rail-item"><span class="kx kx-o"></span><span class="ri-tx"><span class="kx kx-chu" style="width:76%"></span></span></div>
        <div class="rail-item"><span class="kx kx-o"></span><span class="ri-tx"><span class="kx kx-chu" style="width:62%"></span></span></div>
        <div class="rail-item"><span class="kx kx-o"></span><span class="ri-tx"><span class="kx kx-chu" style="width:70%"></span></span></div>
      </div>
    </nav>

    <div class="rail-foot">
      <button class="rail-item ghost" id="btnAdd" title="Thêm một base vào panel">
        <span class="ri-ic" data-ic="them"></span><span class="ri-tx"><b>Thêm base</b></span>
      </button>
      <button class="rail-item ghost" id="btnSettings" title="Trạng thái module, log, phân quyền nhân sự">
        <span class="ri-ic" data-ic="cai-dat"></span><span class="ri-tx"><b>Cài đặt</b></span>
      </button>
    </div>
  </aside>

  <!-- ============ SÂN KHẤU (xanh) ============ -->
  <main class="stage" id="stage">

    <!-- Trang chủ: Tổng quan chung, do lớp vỏ tự dựng -->
    <section class="page" id="pageHome">
      <header class="page-head">
        <div>
          <h1>Tổng quan chung</h1>
          <p class="sub" id="homeSub"></p>
        </div>
        <div class="head-actions">
          <span class="chip" id="homeUser"></span>
          <!-- Chuông thông báo: cạnh tên người dùng cho dễ với.
               Ngôn ngữ và sáng/tối đã nằm trong Cài đặt > Chung nên bỏ khỏi đây,
               khỏi bày hai đường vào cho cùng một thứ. -->
          <button class="btn ghost chuong" id="btnTB" title="Thông báo">
            <span class="chuong-ic"></span>
            <span class="chuong-so" id="tbSo" hidden></span>
          </button>
          <button class="btn ghost" id="btnReload" title="Đọc lại chỉ số của mọi base, và nạp lại app đang mở">Làm mới</button>
        </div>
      </header>

      <!-- Bộ lọc thời gian dùng chung cho cả trang Tổng quan và Lịch chung -->
      <section class="loc-bar"></section>

      <!-- Video + bảng tin nằm NGOÀI #homeBody: trang Tổng quan vẽ lại theo nhịp
           số liệu (20 giây/lần) và mỗi lần vẽ là thay sạch #homeBody. Để khối
           này bên trong thì thẻ <video> bị dựng lại, video quay về giây 0, tải
           lại từ đầu, và mất luôn trạng thái có tiếng. -->
      <div id="khoiTin"></div>

      <!-- Cùng lý do với panel. Ba khối dưới đây là hình MỘT THẺ BASE thật: ô
           chính số to, mấy ô phụ, rồi dòng "Không có: …".
           Đây chỉ là bản cho lần mở ĐẦU TIÊN trên một máy. Từ lần thứ hai,
           veHomeXuong() trong app.js dựng lại theo trí nhớ — đúng số base, đúng
           tên, đúng số ô của chính người đang đăng nhập. -->
      <div class="home-body" id="homeBody" aria-busy="true">
        <div class="kx-vung" id="homeXuong" aria-label="Đang nạp tổng quan">
          <div class="luoi-base">
            <section class="nhom-base"><div class="khoi-head"><span class="kx kx-o"></span><div style="flex:1 1 auto;min-width:0"><span class="kx kx-chu to" style="width:42%"></span></div><span class="grow"></span><span class="kx kx-nut" style="width:46px"></span><span class="kx kx-nut" style="width:66px"></span></div><div class="the-luoi"><div class="the chinh"><span class="kx nhan kx-chu nho" style="width:44%"></span><span class="kx so kx-so to"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:74%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:56%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:88%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:62%"></span><span class="kx so kx-so nho"></span></div></div><div class="the-khong"><span class="kx kx-chu nho" style="width:38%"></span></div></section>
            <section class="nhom-base"><div class="khoi-head"><span class="kx kx-o"></span><div style="flex:1 1 auto;min-width:0"><span class="kx kx-chu to" style="width:42%"></span></div><span class="grow"></span><span class="kx kx-nut" style="width:46px"></span><span class="kx kx-nut" style="width:66px"></span></div><div class="the-luoi"><div class="the chinh"><span class="kx nhan kx-chu nho" style="width:44%"></span><span class="kx so kx-so to"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:74%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:56%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:88%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:62%"></span><span class="kx so kx-so nho"></span></div></div><div class="the-khong"><span class="kx kx-chu nho" style="width:38%"></span></div></section>
            <section class="nhom-base"><div class="khoi-head"><span class="kx kx-o"></span><div style="flex:1 1 auto;min-width:0"><span class="kx kx-chu to" style="width:42%"></span></div><span class="grow"></span><span class="kx kx-nut" style="width:46px"></span><span class="kx kx-nut" style="width:66px"></span></div><div class="the-luoi"><div class="the chinh"><span class="kx nhan kx-chu nho" style="width:44%"></span><span class="kx so kx-so to"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:74%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:56%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:88%"></span><span class="kx so kx-so nho"></span></div><div class="the phu kx-the"><span class="kx nhan kx-chu nho" style="width:62%"></span><span class="kx so kx-so nho"></span></div></div><div class="the-khong"><span class="kx kx-chu nho" style="width:38%"></span></div></section>
          </div>
        </div>
      </div>
    </section>


  </main>
</div>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal-mask" data-close="1"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="mdTitle">—</h3>
      <button class="btn icon ghost" data-close="1" title="Đóng">×</button>
    </div>
    <div class="modal-body" id="mdBody"></div>
    <div class="modal-foot" id="mdFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/khung-xuong.js?v=BUILD"></script>
<script src="/loc.js?v=BUILD"></script>
<script src="/i18n.js?v=BUILD"></script>
<script src="/icons.js?v=BUILD"></script>
<script src="/app.js?v=BUILD"></script>
<script src="/caidat.js?v=BUILD"></script>
<script src="/quyen.js?v=BUILD"></script>
<script src="/nhanh.js?v=BUILD"></script>
<script src="/tbapp.js?v=BUILD"></script>
</body>
</html>
