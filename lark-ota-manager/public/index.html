<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTA Manager · Rooty Trip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237a3cff'/><text x='16' y='22' font-size='13' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>OTA</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">OTA</span>
    <div>
      <div class="brand-title">OTA Manager</div>
      <div class="brand-sub" id="brandSub">Lark Base là nguồn dữ liệu gốc</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn src" id="nguonChip" title="Tự đọc lại bảng Bookings từ Lark Base">—</button>
    <a class="btn primary small" id="btnNhapBooking" target="_blank" rel="noreferrer" hidden>+ Nhập booking OTA</a>
    <button class="btn ghost small" id="btnCsv" title="Xuất danh sách đang lọc ra CSV">Xuất CSV</button>
    <button class="btn ghost small" id="btnRefresh" title="Đọc lại dữ liệu mới nhất từ Lark Base">Đọc lại Lark</button>
    <a class="btn ghost small" id="linkBase" target="_blank" rel="noreferrer" hidden>Mở Base</a>
    <span class="chip" id="meChip">—</span>
  </div>
</header>

<div class="tabsbar">
  <nav class="tabs" id="tabs">
    <button data-tab="moi" class="on">Booking mới</button>
    <button data-tab="thongke">Thống kê OTA</button>
    <button data-tab="lark">Dữ liệu Lark</button>
  </nav>
</div>

<section class="filters" id="filters">
  <div class="fgroup">
    <label>Khoảng thời gian</label>
    <div class="seg" id="mocSeg"></div>
  </div>
  <div class="fgroup">
    <label>Tính theo</label>
    <div class="seg" id="truongSeg"></div>
  </div>
  <div class="fgroup">
    <label>Từ ngày</label>
    <input type="date" id="fFrom">
  </div>
  <div class="fgroup">
    <label>Đến ngày</label>
    <input type="date" id="fTo">
  </div>
  <div class="fgroup grow">
    <label>Kênh OTA</label>
    <div class="pills" id="fKenh"></div>
  </div>
  <div class="fgroup">
    <label>Trạng thái</label>
    <div class="pills" id="fTrangThai"></div>
  </div>
  <div class="fgroup grow">
    <label>Tìm khách / mã booking / tour</label>
    <input type="text" id="fTim" placeholder="Nguyễn Văn A · KLK1234 · 0912…">
  </div>
  <div class="fgroup">
    <label>&nbsp;</label>
    <button class="btn small" id="btnBoLoc">Bỏ lọc</button>
  </div>
</section>

<main id="view"><div class="loading">Đang nạp booking…</div></main>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
