<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quỹ chi phí Marketing</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="khung-xuong.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">₫</span>
    <div>
      <div class="ten">Quỹ chi phí Marketing</div>
      <div class="phu" id="phuDe">đang tải…</div>
    </div>
  </div>
  <div class="sp"></div>
  <!-- Chip vai: cùng lối với app Quản lý quảng cáo và Báo cáo công việc. Vai
       quyết định nửa số nút trên thanh này, nên phải nói thẳng ra vai là gì. -->
  <span class="chip" id="chipVai">…</span>
  <div class="top-right">
    <!-- "Làm mới" chứ không phải "Tải lại": bảy app còn lại của phòng đều dùng
         đúng chữ đó, đúng id đó, đúng câu tooltip đó. Một app gọi khác đi là
         người dùng phải học lại một nút vốn đã biết. -->
    <button class="btn ghost" id="btnRefresh" title="Đọc lại số mới nhất từ Base">Làm mới</button>
    <button class="btn" id="btnNap">Nạp quỹ</button>
    <button class="btn primary" id="btnChiMoi">Khai khoản chi</button>
  </div>
</header>

<main id="man" data-kx-nho="quy-chi-phi">
  <!-- Khung xương cho lần mở ĐẦU TIÊN trên một máy: dựng theo đúng màn đầu
     của app này. Từ lần thứ hai, khung-xuong.js thay chỗ này bằng BẢN CHỤP
     của chính màn thật lần trước (xem README của lark-mkt-hub, mục "Khung

="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:80%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:50%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:80%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:50%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:70%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:50%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:70%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:64%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:70%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:64%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:74%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:64%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:74%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:56%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:74%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:56%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:88%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:56%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:88%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:62%"></span></span><span class="kx kx-nut" style="width:60px"></span></div></div></div>
</main>

<div id="modal" class="modal">
  <div class="hop">
    <div class="hop-dau">
      <div id="mdTitle">…</div>
      <button class="x" data-close="1">×</button>
    </div>
    <div class="hop-than" id="mdBody"></div>
    <div class="hop-chan" id="mdFoot"></div>
  </div>
</div>

<!-- Xem chứng từ. Lớp riêng, không dùng chung #modal: chứng từ hay được mở khi
     đang khai một khoản chi, dùng chung là đóng mất form đang gõ dở. -->
<div id="xemTep" class="xt">
  <div class="xt-hop">
    <div class="xt-dau">
      <span class="xt-ten" id="xtTen"></span>
      <a class="btn sm" id="xtTai" download>Tải xuống</a>
      <button class="x" data-xtclose="1">×</button>
    </div>
    <div class="xt-than" id="xtThan"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="khung-xuong.js"></script>
<script src="app.js"></script>
</body>
</html>
