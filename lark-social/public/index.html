<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social · Rooty Trip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d62976'/><text x='16' y='22' font-size='13' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>SC</text></svg>">
<link rel="stylesheet" href="styles.css?v=__V__">
<link rel="stylesheet" href="khung-xuong.css?v=__V__">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo social">SC</span>
    <div>
      <div class="brand-title">Social — số liệu các kênh</div>
      <div class="brand-sub" id="brandSub">đang nạp dữ liệu…</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn ghost" id="btnSync" title="Kéo số mới từ API các nền tảng về Lark Base">Đồng bộ</button>
    <button class="btn ghost" id="btnConnect" title="Khai token kết nối TikTok · Facebook · Instagram · Zalo OA">Kết nối</button>
    <button class="btn ghost" id="btnRefresh" title="Đọc lại số mới nhất từ Base">Làm mới</button>
    <a class="btn ghost" id="linkBase" target="_blank" rel="noreferrer" title="Mở bảng dữ liệu gốc trên Lark">Mở Base</a>
    <span class="chip" id="meChip">—</span>
  </div>
</header>

<div class="tabsbar"><nav class="tabs" id="tabs"></nav></div>

<section class="filters" id="filters">
  <div class="fgroup">
    <label>Khoảng thời gian</label>
    <div class="seg" id="rangeSeg"></div>
  </div>
  <div class="fgroup">
    <label>Từ ngày</label>
    <input type="date" id="fFrom">
  </div>
  <div class="fgroup">
    <label>Đến ngày</label>
    <input type="date" id="fTo">
  </div>
  <div class="fgroup grow">
    <label>Nền tảng</label>
    <div class="pills" id="fPlatform"></div>
  </div>
  <div class="fgroup">
    <label>&nbsp;</label>
    <button class="btn ghost small" id="btnClearFilter">Bỏ lọc</button>
  </div>
</section>

<main id="view" data-kx-nho="social">
<!-- Khung xương cho lần mở ĐẦU TIÊN trên một máy: dựng theo đúng màn đầu
     của app này. Từ lần thứ hai, khung-xuong.js thay chỗ này bằng BẢN CHỤP
     của chính màn thật lần trước (xem README của lark-mkt-hub, mục "Khung
     xương"). -->
<div class="kx-man kx-vung" aria-busy="true" aria-label="Đang nạp dữ liệu từ Lark Base"><div class="kx-man-the"><div class="kx-the"><span class="kx kx-chu nho" style="width:74%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:56%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:88%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:62%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:80%"></span><span class="kx kx-so to"></span></div><div class="kx-the"><span class="kx kx-chu nho" style="width:50%"></span><span class="kx kx-so to"></span></div></div><div class="kx-khoi"><span class="kx kx-chu to" style="width:32%"></span><span class="kx" style="height:210px;border-radius:10px"></span></div><div class="kx-man-bang"><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:74%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:56%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:88%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:56%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:88%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:62%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:88%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:62%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:80%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:62%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:80%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:50%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:80%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:50%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:70%"></span></span><span class="kx kx-nut" style="width:60px"></span></div><div class="kx-hang"><span class="kx kx-o" style="width:22px;height:22px"></span><span style="flex:2;min-width:0"><span class="kx kx-chu " style="width:50%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:70%"></span></span><span style="flex:1;min-width:0"><span class="kx kx-chu nho" style="width:64%"></span></span><span class="kx kx-nut" style="width:60px"></span></div></div></div>
</main>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="khung-xuong.js?v=__V__"></script>
<script src="charts.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
</body>
</html>
