# ============================================================
# Triển khai Marketing Hub lên Render.com
#
# MỘT web service duy nhất: chạy lớp vỏ (lark-mkt-hub). Chính nó tự bật sáu app
# module như tiến trình con trong cùng container rồi proxy vào một cổng — nên chỉ
# cần một URL công khai, một chỗ đăng nhập, một service phải trả tiền.
#
# Biến có `sync: false` phải tự điền trong dashboard của Render (đừng để trong repo).
#
# LẦN DEPLOY ĐẦU Render chỉ hỏi 4 giá trị — cố ý gom lại ít nhất có thể:
#
#   LARK_APP_SECRET      App Secret của app "Tracking" (cli_aa04305ecd385ed1)
#   ANH_TIN_APP_SECRET   App Secret của app "Marketing Hub" (cli_aa1a8ae21a78ded2)
#   LARK_MANAGER_EMAILS  email Lark của quản lý, VD hunglv@rootytrip.com
#   PUBLIC_URL           để TRỐNG lần đầu; điền URL Render cấp rồi deploy lại
#
# Bốn biến khác Render tự sinh. Mọi biến còn lại đã comment vì KHÔNG cần cho lần
# đầu — app nào thiếu token thì chỉ app đó không đồng bộ, Hub vẫn chạy.
# ============================================================
services:
  - type: web
    name: mkt-hub
    runtime: node
    plan: free
    region: singapore
    rootDir: lark-mkt-hub
    buildCommand: ""              # không có dependency npm nào
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"

      # ---- Lark app nền tảng: đọc/ghi Base + đăng nhập Lark ----
      # App "Tracking" trong Developer Console. App ID không phải bí mật nên cắm sẵn
      # để Render bớt một câu hỏi; chỉ Secret là phải dán tay.
      # LƯU Ý: app gửi tin nhóm là app KHÁC ("Marketing Hub") — xem ANH_TIN_APP_ID
      # ở phần dưới. Đừng lẫn hai App ID với nhau.
      - key: LARK_APP_ID
        value: cli_aa04305ecd385ed1
      - key: LARK_APP_SECRET
        sync: false

      # ---- URL công khai của service này, dùng làm redirect_uri khi đăng nhập ----
      - key: PUBLIC_URL
        sync: false

      # ---- khoá ký cookie phiên; Render tự sinh ----
      - key: SESSION_SECRET
        generateValue: true

      # ---- ai là quản lý ----
      # Đặt bằng env var vì ổ đĩa Render là tạm: file quyen.json mất sau mỗi deploy.
      #
      # DÙNG EMAIL, ĐỪNG DÙNG open_id: **open_id khác nhau giữa các app Lark**, nên
      # đổi app nền tảng là phải khai lại và quản lý bị tụt xuống vai nhân sự mà
      # không hiểu vì sao. Email thì không đổi. Nhiều người thì cách nhau bằng phẩy.
      # VD: hunglv@rootytrip.com
      - key: LARK_MANAGER_EMAILS
        sync: false

      # Vẫn dùng được (cộng dồn với EMAILS) nếu ai đó không có email công ty.
      # - key: LARK_MANAGER_IDS
      #   sync: false

      # ---- token kết nối nền tảng quảng cáo (Meta / TikTok / Google Sheet) ----
      # Ổ đĩa Render là TẠM: ket-noi.json mất sau mỗi lần deploy, mất token là các
      # kênh tự tắt mà không báo. Dán nguyên nội dung ket-noi.json vào biến này.
      #
      # KHÔNG để token trong Lark Base như bảng phân quyền: cả phòng xem được Base,
      # còn đây là bí mật. Biến môi trường của Render mới là chỗ giữ bí mật.
      # CHƯA CẦN cho lần deploy đầu: thiếu thì app quảng cáo chỉ không đồng bộ được,
      # phần còn lại của Hub vẫn chạy. Bỏ dấu # khi nào cần bật đồng bộ quảng cáo.
      # - key: ADS_CONNECT_JSON
      #   sync: false

      # ---- ngưỡng cảnh báo của app quảng cáo (cùng lý do ổ đĩa tạm) ----
      # CHƯA CẦN: không khai thì dùng mục tiêu CPA mặc định trong code.
      # - key: ADS_TARGETS_JSON
      #   sync: false

      # ============================================================
      # App Booking OTA
      # ============================================================
      # Base + 3 bảng đã cắm sẵn trong config.js (base XrMkbW5FPaQlHpsMSN8lQFO9geW:
      # Bookings + Danh mục OTA + Danh mục Tour). Chỉ khai hai biến dưới khi đổi base.
      # Bỏ TRỐNG OTA_BASE_TOKEN thì app vẫn nhận webhook nhưng chỉ giữ trong hàng
      # đợi cục bộ — mà ổ đĩa Render là TẠM, deploy lại là mất.
      # - key: OTA_BASE_TOKEN
      #   sync: false
      # - key: OTA_TABLE_ID
      #   sync: false

      # Bí mật webhook: OTA gửi kèm header x-ota-secret. CHƯA khai biến này thì
      # app chỉ nhận webhook từ 127.0.0.1 — tức OTA gọi vào sẽ bị từ chối 403.
      # Sinh một chuỗi ngẫu nhiên dài rồi đưa cho từng OTA.
      - key: OTA_WEBHOOK_SECRET
        generateValue: true

      # ---- GIÁ và HOA HỒNG: KHÔNG khai ở đây ----
      # Nguồn thật nằm TRONG BASE, và cũng chính là nguồn mà công thức của Base đọc:
      #   giá thu về  -> bảng "Danh mục Tour", cột Giá thu về NL / Giá thu về TE
      #   % hoa hồng  -> bảng "Danh mục OTA",  cột Hoa hồng %
      # Sửa hai bảng đó là app đổi theo trong 10 phút — không deploy lại, không sửa
      # code. Hai biến dưới CHỈ là bảng dự phòng cho lúc chưa nối được Base.
      # CHƯA CẦN: không khai thì dùng bảng giá mặc định trong lark-ota-manager/gia.js.
      # - key: OTA_GIA_JSON
      #   sync: false
      # CHƯA CẦN: không khai thì giữ tỷ lệ hoa hồng mặc định.
      # - key: OTA_RATES_JSON
      #   sync: false

      # Tỷ giá về VNĐ, VD {"USD":26200,"KRW":18.4}. App điền cột "Tỷ giá về VND" để
      # công thức Gross VND của Base ra đúng — KHÔNG điền thì Gross VND bằng đúng số
      # nguyên tệ (120 USD thành 120đ). Đây là số ƯỚC TÍNH, kế toán vẫn sửa tay khi
      # đối soát; khai biến này khi tỷ giá lệch nhiều so với mặc định trong config.js.
      # CHƯA CẦN: không khai thì dùng tỷ giá mặc định.
      # - key: OTA_TY_GIA_JSON
      #   sync: false

      # ============================================================
      # App Social (TikTok / Facebook / Instagram / Zalo OA)
      # ============================================================
      # Base đã cắm sẵn trong config.js (YzgUbMS3PaE0B9sDtdIlNYzFgsc). Chỉ khai
      # SOCIAL_BASE_TOKEN khi đổi sang base khác.
      # - key: SOCIAL_BASE_TOKEN
      #   sync: false

      # Token các nền tảng social. Cùng lý do với ADS_CONNECT_JSON: ổ đĩa Render
      # là TẠM nên ket-noi.json bay sau mỗi lần deploy. Dán nguyên nội dung file
      # ket-noi.json của lark-social vào biến này.
      # CHƯA CẦN cho lần deploy đầu: thiếu thì app Social chỉ không đồng bộ được.
      # - key: SOCIAL_CONNECT_JSON
      #   sync: false

      # ---- CHÌA KHOÁ CHO KHO TOKEN — KHÔNG KHAI LÀ TIKTOK/ZALO TỰ CHẾT ----
      # TikTok và Zalo cấp refresh token DÙNG MỘT LẦN: mỗi lần app làm mới là nền
      # tảng huỷ cái cũ. Bản mới phải được cất ở chỗ sống qua lần deploy sau, mà
      # SOCIAL_CONNECT_JSON thì đóng băng ở giá trị dán tay — tức là đã chết.
      #
      # Có biến này, app mã hoá AES-256-GCM rồi cất vào bảng "Kho khoá (mã hoá)"
      # trên Base. Cả phòng mở Base ra chỉ thấy một chuỗi rác; chìa nằm ở đây,
      # chỉ người quản trị Render thấy. Render tự sinh giá trị.
      #
      # ĐỔI GIÁ TRỊ NÀY = MẤT HẾT TOKEN ĐÃ CẤT (phải nối lại TikTok/Zalo từ đầu).
      - key: SOCIAL_VAULT_KEY
        generateValue: true

      # ============================================================
      # App Chỉnh ảnh & Edit video
      # ============================================================
      # Base đã cắm sẵn trong config.js (OzF9bSPkPamYQHsNcU8lmMVQgFb). Chỉ khai
      # ANH_BASE_TOKEN khi đổi sang base khác.
      # - key: ANH_BASE_TOKEN
      #   sync: false

      # ---- BẮT BUỘC: app Lark đứng tên gửi tin vào nhóm ----
      # Anh Hùng chốt nhóm SỬA ẢNH chỉ thấy MỘT người gửi, là app "Marketing Hub".
      # Đó là app KHÁC với LARK_APP_ID ở trên (app "Tracking") — phòng có 5 app Lark,
      # xem lark-chinh-anh/README.md. Không khai hai biến này thì app gửi bằng bot của
      # app nền tảng, và phải mời thêm một bot nữa vào nhóm.
      #
      # App ID lấy ở https://open.larksuite.com/app/cli_aa1a8ae21a78ded2
      # Secret dán tay trong dashboard Render (sync: false) — KHÔNG để trong repo.
      - key: ANH_TIN_APP_ID
        value: cli_aa1a8ae21a78ded2
      - key: ANH_TIN_APP_SECRET
        sync: false

      # Tiêu đề thẻ gửi vào nhóm. Người đọc là Media và CSKH, không phải người chỉnh
      # ảnh — đổi câu chữ ở đây, không phải sửa code.
      # - key: ANH_TIEU_DE_TIN
      #   value: Media khách hàng Rooty Trip

      # Nhóm chat nhận báo cáo nằm ở bảng "Cài đặt" TRÊN BASE (quản lý đổi được
      # ngay trong app), nên bình thường không phải khai gì ở đây. Hai biến dưới
      # chỉ là mồi cho lần chạy đầu khi bảng Cài đặt còn rỗng.
      # - key: ANH_CHAT_ID
      #   value: oc_510640bcfd1063a51d32db0d58f95d72
      # - key: ANH_CHAT_TEN
      #   value: SỬA ẢNH

      # ---- BA VIỆC PHẢI LÀM TRONG LARK, KHÔNG PHẢI Ở ĐÂY ----
      # 1. Chia sẻ Base "Chỉnh ảnh & Edit video" cho app **Tracking** (quyền chỉnh
      #    sửa). Thiếu bước này thì app đọc/ghi Base ở chế độ api trả `91403`.
      # 2. Cấp scope `im:message` cho app **Marketing Hub** rồi PHÁT HÀNH version mới.
      #    Cấp mà không phát hành thì Lark trả `99991672`.
      # 3. Mời bot **Marketing Hub** vào nhóm SỬA ẢNH. Thiếu thì Lark trả
      #    230002/230013 — báo cáo vẫn ghi được vào Base, chỉ là nhóm không nhận tin,
      #    và app hiện nhãn "chưa gửi" kèm nút gửi lại.
      #
      # ---- Một hạn chế đã biết của bản online ----
      # Ô "Người chỉnh" tra danh bạ Lark bằng `contact +search-user`, mà lệnh đó chỉ
      # chạy với danh tính NGƯỜI (lark-cli trên máy cá nhân). Ở chế độ api chỉ có
      # tenant token nên ô tìm trả rỗng; app lùi về danh sách người ĐÃ TỪNG xuất hiện
      # trong bảng Báo cáo. Người tự báo cáo việc của mình thì vẫn đúng (mặc định là
      # chính người đang đăng nhập), và danh sách tự đầy lên sau vài ngày.

      # ============================================================
      # App Báo cáo & KPI
      # ============================================================
      # Base "KPI Marketing" đã cắm sẵn trong config.js
      # (E2nYbb69OaJxdVs0nGGlHTy5g0f). Chỉ khai KPI_BASE_TOKEN khi đổi base.
      #
      # VÌ SAO PHẢI CÓ BASE Ở ĐÂY: điểm KPI trước nay nằm ở hai tệp JSON trong
      # `lark-kpi/du-lieu/`. Thư mục đó cố ý KHÔNG lên GitHub (gắn với lương
      # từng người, repo thì công khai), mà ổ đĩa Render lại là ổ TẠM — nhập tay
      # vào cũng bay sau lần deploy sau. Nên trước khi có Base, nửa KPI trên
      # server chung luôn trống. Base là chỗ duy nhất số sống được mà vẫn không
      # lọt lên GitHub.
      #
      # Để TRỐNG biến này (KPI_BASE_TOKEN=) thì app quay về đọc hai tệp JSON —
      # chỉ hợp với máy cá nhân, trên Render là mất số.
      # - key: KPI_BASE_TOKEN
      #   sync: false

      # ============================================================
      # Trợ lý hỏi đáp (bot)
      # ============================================================
      # Chìa khoá cho bộ não bên ngoài (Coze / n8n / gì cũng được) gọi vào lấy số
      # liệu thật. CHƯA khai biến này thì nhánh /bot trả 404 như không tồn tại —
      # cố ý fail closed, deploy quên khai thì cửa đóng chứ không mở toang.
      #
      # Render tự sinh giá trị. Muốn xem để dán vào Coze thì mở Environment của
      # service trên dashboard Render, KHÔNG dán vào code hay vào chat.
      # Nghi bị lộ thì bấm sinh lại — bot mất kết nối, dán chìa mới vào Coze là xong.
      - key: BOT_API_TOKEN
        generateValue: true

      # ---- trang nào được nhúng hub bằng iframe ----
      # Bỏ trống là dùng mặc định: chính nó + các tên miền Lark. Chỉ khai khi mở app
      # trong một cổng thông tin khác.
      # - key: HUB_FRAME_ANCESTORS
      #   sync: false

      # ---- cùng bộ credential cho sáu app con ----
      # Hub truyền toàn bộ env xuống tiến trình con, nên chỉ cần khai một lần ở trên.
      # Sáu app con tự chuyển sang chế độ `api` khi thấy LARK_APP_ID + LARK_APP_SECRET.
      #
      # KHÔNG khai BIND_HOST cho service này: năm app con phải giữ mặc định chỉ nghe
      # 127.0.0.1. Chúng tin header danh tính do hub gửi, nên mở cổng ra ngoài là ai
      # cũng tự xưng được là quản lý.
